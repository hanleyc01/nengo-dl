[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nengo-dl"
version = "3.6.1.dev0"
description = "Deep learning integration for Nengo"
readme = "README.rst"
license = {text = "Free for non-commercial use"}
authors = [{name = "Applied Brain Research", email = "info@appliedbrainresearch.com"}]
requires-python = ">=3.10"
dependencies = [
    "nengo>=3.0.0",
    "numpy>=1.16.0",
    "tensorflow>=2.21",
    "tf-keras>=2.21",
    "jinja2>=2.10.1",
    "packaging>=20.0",
    "progressbar2>=3.39.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Nengo",
    "Intended Audience :: Science/Research",
    "License :: Free for non-commercial use",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://www.nengo.ai/nengo-dl"

[project.optional-dependencies]
docs = [
    "click>=6.7",
    "jupyter>=1.0.0",
    "matplotlib>=2.0.0",
    "nbsphinx>=0.3.5",
    "nengo-sphinx-theme>=1.2.1",
    "numpydoc>=0.6.0",
    "Pillow>=4.1.1",
    "sphinx>=3.0.0",
    "sphinx-click>=1.4.1",
]
optional = [
    "keras-spiking>=0.3.0",
]
tests = [
    "click>=6.7",
    "matplotlib>=2.0.0",
    "nbval>=0.6.0",
    "pytest>=3.6.0",
    "pytest-allclose>=1.0.0",
    "pytest-cov>=2.6.0",
    "pytest-rng>=1.0.0",
    "pytest-xdist>=1.16.0",
    "six>=1.11.0",
]
all = [
    "nengo-dl[docs,optional,tests]",
]

[project.entry-points."nengo.backends"]
dl = "nengo_dl:Simulator"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
target-version = ['py37']
force_exclude = '''
(
    '*/whitepaper2018_code.py'
)
'''

[tool.isort]
profile = "black"
src_paths = ["nengo_dl"]

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 81
pre-summary-newline = true
